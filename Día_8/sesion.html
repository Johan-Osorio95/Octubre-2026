<!DOCTYPE html>
<html lang='es'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>JohanWeb</title>
    <link rel='stylesheet' href='css/sesion.css'>
    <script src="js/main.js" defer></script>
</head>

<body class="body">
    <header class="header">
        <h1 class="header__h1">Re-Tonadas</h1>
        <img src="images/Logo.png" alt="logo" class="header__logo">

        <nav class="header__nav">
            <ul class="header__ul">
                <li class="header__li"><a class="header__a" href="pedido.html">Mi Pedido</a></li>
                <li class="header__li"><a class="header__a" href="instrumentos.html">Instrumentos</a></li>
                <li class="header__li"><a class="header__a" href="index.html">Inicio</a></li>
                <li class="header__li"><a class="header__a" href="sesion.html">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <img src="images/Saxofón.png" class="main__foto" alt="saxo">
    </main>

    <main class="sesion">

        <form action="formulario"></form>

          <h1 clas="sesion__h1">Inicio de sesión:</h1>

          

            <label for="nombre">Nombre:</label>
            <input type="texto" id="nombre" name="nombre" required>
        
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="contraseña">Contraseña:</label>
            <input type="contraseña" name="contraseña" id="contraseña" required>
        </form>

          <button class="main__boton">Crear Cuenta</button>
          <button class="main__boton">Continuar</button>
    </main>

    <footer>
        <p>&copy;2026 - Todos los derechos reservados.</p>
    </footer>
</body>

</html>
