<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/contacto.css">
    <script src="js/main.js" defer></script>

</head>

<body class="body">

    <!--Debe contener: nombre, email, teléfono, texto largo y un botón de enviar.
        Después decóralo de una manera agradable para el usuario.-->

    <main class="main">

        <div class="div__formulario">
            <form method="POST" action="formulario" class="formulario">

                <h1 clas="main__h1">Comunicate con nosotros</h1>

                <label for="nombre">Nombre:</label>
                <input type="nombre" id="nombre" name="nombre" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="telefono">teléfono:</label>
                <input type="apellido" id="apellido" name="apellido" required>

                <label for="comentario">Dejanos tu cometario:</label>
                <textarea name="comentarios" id="comentarios"></textarea>

                <div class="div__boton">
                    <button class="boton">Enviar</button>
                </div>

            </form>
        </div>
    </main>


</body>

</html>
