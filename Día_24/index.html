<!DOCTYPE html>
<html lang='es'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>JohanWeb</title>
    <link rel='stylesheet' href='css/main.css'>
    <script src="js/main.js" defer></script>
</head>

<body class="body">

    <!-- ACTIVIDAD 24 -->
    <main class="main">

        <!-- NIVEL 1 -->
        <div class="fotopantalla">
            <div>
                <h1 class="div__h1">Nivel 1</h1>
            </div>

            <picture>
                <source srcset="images/actividad24.webp" type="image/webp">
                <img src="images/actividad24.png" alt="actividad24" title="Nivel1">
            </picture>
        </div>

        <div class="div">
            <h1 class="div__h1">Nivel 2</h1>
        </div>

        <!-- NIVEL 2 -->
        <div class="div__texto">

            <textarea id="texto" placeholder="Escribe algo..."></textarea>

            <button id="boton">></button>

            <p id="addtexto"></p>

        </div>

        <div>
            <h1 class="div__h1">Nivel 3</h1>
        </div>

        <!-- NIVEL 3 -->
        <div class="div__suma">
            <input id="num1" type="number" placeholder="Primer número: ">
            <input id="num2" type="number" placeholder="Segundo número: ">
            <button id="botonaction">Acción</button>
            <p id="resultadosuma" placeholder="Resultado"></p>
        </div>

    </main>

    <footer class="footer">
        <p class="footer__derechos-p">&copy; 2026 - Los elementos usados aquí, son para fines educativos - Todos los
            derechos reservados.</p>
    </footer>

</body>

</html>
